<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt bàn - Restaurant Booking</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="booking-header">
        <h1>Restaurant Booking</h1>
        <p>Đặt bàn dễ dàng, nhanh chóng</p>
    </header>

    <main class="booking-container">

        <div class="booking-title">
            <h2>ĐẶT BÀN NHÀ HÀNG</h2>
            <p>Vui lòng chọn thông tin đặt bàn của bạn</p>
        </div>

        <form class="booking-form">

            <div class="form-group">
                <label for="booking-date">Ngày đặt bàn</label>
                <input type="date" id="booking-date">
            </div>

            <div class="form-group">
                <label for="booking-time">Giờ đặt bàn</label>
                <select id="booking-time">
                    <option value="">Chọn giờ</option>
                    <option>10:00</option>
                    <option>11:00</option>
                    <option>12:00</option>
                    <option>13:00</option>
                    <option>17:00</option>
                    <option>18:00</option>
                    <option>19:00</option>
                    <option>20:00</option>
                </select>
            </div>

            <div class="form-group">
                <label for="guest-number">Số lượng khách</label>
                <select id="guest-number">
                    <option value="">Chọn số khách</option>
                    <option>1 - 2 người</option>
                    <option>3 - 4 người</option>
                    <option>5 - 6 người</option>
                    <option>7 - 8 người</option>
                    <option>Trên 8 người</option>
                </select>
            </div>

            <div class="form-group">
                <label for="booking-area">Khu vực</label>
                <select id="booking-area">
                    <option value="">Chọn khu vực</option>
                    <option>Trong nhà</option>
                    <option>Ngoài trời</option>
                    <option>Phòng riêng</option>
                </select>
            </div>

            <button type="button" class="search-btn">
                TÌM BÀN
            </button>

        </form>

    </main>

    <script src="../js/app.js"></script>
    <script src="../js/booking.js"></script>

</body>
</html>
